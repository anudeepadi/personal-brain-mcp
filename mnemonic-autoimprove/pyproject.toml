[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mnemonic-autoimprove"
version = "0.1.0"
description = "Self-improving RAG optimization engine inspired by Karpathy's autoresearch"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Mnemonic Contributors" },
]
keywords = ["rag", "autoresearch", "self-improving", "llm", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.0",
    "click>=8.0",
    "langchain>=0.2.0",
    "langchain-google-genai>=1.0.0",
    "langchain-pinecone>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
mnemonic-autoimprove = "mnemonic_autoimprove.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mnemonic_autoimprove"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
