<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">ContextOS interfaces and services</title><desc id="desc">MCP clients and the FastAPI web interface access parsing, embedding, storage, and search. Inference and vector storage use external providers.</desc><rect width="1200" height="400" rx="18" fill="#EFF2FD"/><text x="40" y="49" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5D698E" font-weight="700" letter-spacing="2">TWO INTERFACES. ONE KNOWLEDGE WORKFLOW.</text><rect x="40" y="80" width="516" height="100" rx="10" fill="#FFF" stroke="#D6DDF4"/><text x="64" y="121" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#16234C" font-weight="700" >MCP clients</text><text x="64" y="153" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5D698E" font-weight="400" >10 tools + 5 resource declarations</text><path d="M298 180 V212 H600 V240" stroke="#8997BD" fill="none"/><rect x="644" y="80" width="516" height="100" rx="10" fill="#FFF" stroke="#D6DDF4"/><text x="668" y="121" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#16234C" font-weight="700" >REST + connected web UI</text><text x="668" y="153" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5D698E" font-weight="400" >FastAPI endpoints + static frontend</text><path d="M902 180 V212 H600 V240" stroke="#8997BD" fill="none"/><rect x="311" y="240" width="578" height="61" rx="10" fill="#4859F5"/><text x="600" y="279" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#FFF" font-weight="400" text-anchor="middle">Parse → Embed → Store → Search</text><text x="600" y="353" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#5D698E" font-weight="400" text-anchor="middle">Google embeddings · Pinecone storage · Gemini / optional Anthropic answers</text></svg>
