<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc"><title id="title">ContextOS retrieval workflow</title><desc id="desc">Capture, index with Google embeddings, retrieve from Pinecone, then access passages and answers through MCP or REST.</desc><rect width="1200" height="360" rx="18" fill="#111A35"/><text x="40" y="48" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#A5B2DC" font-weight="700" letter-spacing="2">FROM SAVED MATERIAL TO USEFUL CONTEXT</text><rect x="40" y="82" width="235" height="220" rx="10" fill="#1B2748" stroke="#2D3A64"/><text x="60" y="122" font-family="monospace" font-size="15" fill="#B7ED87" font-weight="700" >01</text><text x="60" y="169" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#F0F3FF" font-weight="700" >Capture</text><text x="60" y="213" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#A5B2DC" font-weight="400" >Upload a document.</text><text x="60" y="239" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#A5B2DC" font-weight="400" >Save or import a chat.</text><path d="M286 188 h30 l-6-6 m6 6 l-6 6" stroke="#A5B2DC" fill="none"/><rect x="335" y="82" width="235" height="220" rx="10" fill="#1B2748" stroke="#2D3A64"/><text x="355" y="122" font-family="monospace" font-size="15" fill="#B7ED87" font-weight="700" >02</text><text x="355" y="169" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#F0F3FF" font-weight="700" >Index</text><text x="355" y="213" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#A5B2DC" font-weight="400" >Extract and chunk text.</text><text x="355" y="239" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#A5B2DC" font-weight="400" >Embed with Google.</text><path d="M581 188 h30 l-6-6 m6 6 l-6 6" stroke="#A5B2DC" fill="none"/><rect x="630" y="82" width="235" height="220" rx="10" fill="#1B2748" stroke="#2D3A64"/><text x="650" y="122" font-family="monospace" font-size="15" fill="#B7ED87" font-weight="700" >03</text><text x="650" y="169" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#F0F3FF" font-weight="700" >Retrieve</text><text x="650" y="213" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#A5B2DC" font-weight="400" >Search Pinecone.</text><text x="650" y="239" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#A5B2DC" font-weight="400" >Return matching passages.</text><path d="M876 188 h30 l-6-6 m6 6 l-6 6" stroke="#A5B2DC" fill="none"/><rect x="925" y="82" width="235" height="220" rx="10" fill="#1B2748" stroke="#2D3A64"/><text x="945" y="122" font-family="monospace" font-size="15" fill="#B7ED87" font-weight="700" >04</text><text x="945" y="169" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#F0F3FF" font-weight="700" >Use</text><text x="945" y="213" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#A5B2DC" font-weight="400" >Read through MCP or API.</text><text x="945" y="239" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#A5B2DC" font-weight="400" >Ask with source references.</text></svg>
